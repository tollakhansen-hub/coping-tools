name: Coping visual and accessibility audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install audit dependencies
        working-directory: audit
        run: npm install --no-audit --no-fund
      - name: Run audit against public site
        working-directory: audit
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coping-visual-audit
          path: audit/audit-output/
          retention-days: 14
